name: Build Android APK

on:
  push:
    branches: [ "CapacitorWrap", "PhaserRevision" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: phaser_game/package-lock.json

      - name: Install Dependencies
        run: |
          cd phaser_game
          npm install

      - name: Build Web Project
        run: |
          cd phaser_game
          npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: |
          cd phaser_game
          npx cap sync android

      - name: Build Android APK
        run: |
          cd phaser_game/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hilltop-rampage-apk
          path: phaser_game/android/app/build/outputs/apk/debug/app-debug.apk
