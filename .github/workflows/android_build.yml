name: Build Android APK

on:
  push:
    branches: [ "CapacitorWrap", "PhaserRevision" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: phaser_game/package-lock.json

      - name: Install Dependencies
        run: |
          cd phaser_game
          npm ci

      - name: Build Web Project
        run: |
          cd phaser_game
          # Ensure vite binary is executable if npm ci didn't set it (edge case)
          chmod +x node_modules/.bin/vite || true
          npx vite build
          ls -la dist  # Verify build output

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sync Capacitor
        run: |
          cd phaser_game
          npx cap sync android

      - name: Build Android APK
        run: |
          cd phaser_game/android
          ls -la  # Debug: Check if gradlew exists
          # Fix potential Windows line ending issues in gradlew
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          # Use bash explicitly to avoid shebang issues
          bash gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hilltop-rampage-apk
          path: phaser_game/android/app/build/outputs/apk/debug/app-debug.apk
